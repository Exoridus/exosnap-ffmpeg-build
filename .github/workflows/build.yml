name: Build FFmpeg

# Trigger: manually via workflow_dispatch, or automatically on a package tag.
#
# A package tag is `n<upstream>-exosnap.<revision>`, for example
# `n9.0.2-exosnap.1`. It answers exactly two questions: which upstream ref was
# built, and which revision of our recipe built it. A revision only increases
# when the recipe changes while the upstream ref stays put.
#
# The profile is deliberately NOT in the tag. Whether the artifact is LGPL-only
# is a fact to verify in the archive (BUILD-INFO.json, plus the self-check in
# the assemble step), not a string to trust in a file name.
#
# `r*` stays in the trigger so the seven historical tags keep resolving, but a
# push of one is refused: an r-tag carries no upstream version, so this workflow
# cannot know what it would have to build.
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: >
          FFmpeg upstream git ref to build (branch, tag, or commit SHA).
          Example: n9.0.2
        required: true
        default: "n9.0.2"
      package_revision:
        description: >
          Our package revision for that upstream ref. Starts at 1, and only
          increases when the recipe changes while the upstream ref does not.
        required: false
        default: "1"
  push:
    tags:
      - "n*-exosnap.*"
      - "r*"

# ---------------------------------------------------------------------------
# Derived values shared across steps
# ---------------------------------------------------------------------------
# FFMPEG_REF, PACKAGE_TAG, PACKAGE_REVISION and ARCHIVE_STEM are resolved by the
# identity step below, from the tag or the dispatch inputs. Nothing here hard
# codes an upstream version: the previous default made a tag push silently build
# `n8.1.1` whatever the tag said.
env:
  # Cross-compilation prefix
  CROSS_PREFIX: x86_64-w64-mingw32-

  # Installation prefix inside the build tree
  INSTALL_PREFIX: /tmp/ffmpeg-install

jobs:
  build:
    name: Build FFmpeg (mingw-w64 cross)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases

    steps:
      # -----------------------------------------------------------------------
      # 0. Resolve the package identity before anything is built
      # -----------------------------------------------------------------------
      # Everything downstream reads FFMPEG_REF, so the tag is the single place
      # the upstream version comes from on a tag build. A tag that does not say
      # what it builds fails here, before a toolchain is installed.
      - name: Resolve package identity
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "${TAG}" in
              n*-exosnap.*)
                UPSTREAM_REF="${TAG%%-exosnap.*}"
                PACKAGE_REVISION="${TAG##*-exosnap.}"
                ;;
              r*)
                echo "::error::'${TAG}' is a legacy r-tag. It carries no upstream version, so this workflow cannot know what to build. r1 through r7 stay published exactly as they are; a new build uses n<upstream>-exosnap.<revision>, for example n9.0.2-exosnap.1."
                exit 1
                ;;
              *)
                echo "::error::tag '${TAG}' does not match n<upstream>-exosnap.<revision>."
                exit 1
                ;;
            esac
            PACKAGE_TAG="${TAG}"
          else
            UPSTREAM_REF='${{ inputs.upstream_ref }}'
            PACKAGE_REVISION='${{ inputs.package_revision }}'
            PACKAGE_TAG="${UPSTREAM_REF}-exosnap.${PACKAGE_REVISION}"
          fi

          case "${PACKAGE_REVISION}" in
            ''|*[!0-9]*)
              echo "::error::package revision '${PACKAGE_REVISION}' is not a number."
              exit 1
              ;;
          esac

          {
            echo "FFMPEG_REF=${UPSTREAM_REF}"
            echo "PACKAGE_TAG=${PACKAGE_TAG}"
            echo "PACKAGE_REVISION=${PACKAGE_REVISION}"
            echo "ARCHIVE_STEM=ffmpeg-${UPSTREAM_REF}-win64-lgpl-shared"
          } >> "$GITHUB_ENV"

          echo "package tag:      ${PACKAGE_TAG}"
          echo "upstream ref:     ${UPSTREAM_REF}"
          echo "package revision: ${PACKAGE_REVISION}"

      # -----------------------------------------------------------------------
      # 1. Install cross toolchain and build tools
      # -----------------------------------------------------------------------
      - name: Install mingw-w64 cross toolchain and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            llvm \
            nasm \
            yasm \
            pkg-config \
            make \
            git \
            zip \
            unzip
          echo "Toolchain versions:"
          x86_64-w64-mingw32-gcc --version
          nasm --version
          # llvm-dlltool may ship with a version suffix on Ubuntu
          DLLTOOL=$(command -v llvm-dlltool 2>/dev/null || \
                    ls /usr/bin/llvm-dlltool-* 2>/dev/null | sort -V | tail -1 || true)
          echo "llvm-dlltool: ${DLLTOOL}"
          [ -n "${DLLTOOL}" ] && "${DLLTOOL}" --version || echo "llvm-dlltool not found in PATH"

      # -----------------------------------------------------------------------
      # 2. Clone FFmpeg at the pinned ref (shallow)
      # -----------------------------------------------------------------------
      - name: Clone FFmpeg at ${{ env.FFMPEG_REF }}
        run: |
          git clone --depth=1 --branch "${FFMPEG_REF}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          COMMIT=$(git -C ffmpeg-src rev-parse HEAD)
          echo "FFMPEG_COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "Cloned FFmpeg commit: ${COMMIT}"

      # -----------------------------------------------------------------------
      # 3. Configure — minimal LGPL shared, mux-only component whitelist
      #
      # Components included (derived from ExoSnap's mp4_remuxer.cpp and
      # cmake/VendorFFmpeg.cmake):
      #   Libraries:  avformat, avcodec, avutil, swresample
      #   Demuxers:   mov (MP4/MOV input), matroska (MKV/WebM input)
      #   Muxers:     mp4, mov (MP4 faststart), matroska (recovery MKV), webm
      #   Protocols:  file
      #   Parsers:    h264, hevc, av1, aac, opus, vorbis, mpegaudio
      #   Decoders:   h264, hevc, av1, opus, aac, flac,
      #               pcm_s16le, pcm_s24le, pcm_s32le, pcm_f32le
      #   Encoders:   aac (AAC-LC — ExoSnap FfmpegAacEncoder, ADR 0052)
      #   BSFs:       aac_adtstoasc, extract_extradata,
      #               h264_mp4toannexb, hevc_mp4toannexb, av1_metadata, null
      #
      # r2 adds --enable-muxer=mp4: avformat_alloc_output_context2("mp4", …)
      # requires the "mp4" muxer registration; "mov" alone is insufficient even
      # though both share the movenc backend.
      # r3 adds --enable-demuxer=mov: reading back the generated MP4 in tests
      # (avformat_open_input on .mp4 output) requires the mov/mp4 demuxer.
      # r3 -> r4: added --enable-decoder=* for h264/hevc/av1/opus/aac/flac/pcm_* --
      # the Edit-page video player needs to decode every codec ExoSnap itself can
      # produce. Previously avcodec carried zero decoders (mux/demux-only build).
      # r4 -> r5: added --enable-encoder=aac. Through r4 the avcodec DLL carried
      # zero *encoders* (--disable-everything drops them and no --enable-encoder
      # was ever set), so avcodec_find_encoder(AV_CODEC_ID_AAC) returned NULL at
      # runtime. ExoSnap is migrating its AAC path off the statically-linked
      # FDK-AAC library (ADR 0043) onto FFmpeg's native AAC-LC encoder
      # (FfmpegAacEncoder, ExoSnap ADR 0052), which needs this encoder compiled
      # in. Deliberately NO --enable-muxer=adts: ExoSnap packages AAC as raw AAC
      # access units plus AudioSpecificConfig extradata (A_AAC CodecPrivate in
      # Matroska; codecpar extradata carried through the MP4 remux), never as an
      # ADTS bitstream, so the encoder's default raw output already matches the
      # container writers with no ADTS framing required.
      #
      # r5 -> r7: added --enable-hwaccel=* (D3D11VA/DXVA2 for h264, hevc, av1)
      # plus the explicit --enable-d3d11va/--enable-dxva2 library switches.
      # NOTE the version jump: r6 (--enable-gpl + libx264 + libx265) was reverted
      # on the ExoSnap side after the x264/x265 patent review (ExoSnap ADR 0007).
      # r7 therefore continues the LGPL r5 line and deliberately does NOT carry
      # r6's GPL/x264/x265 additions -- this file was restored from the r5 tag
      # before the hwaccel flags were appended, and it is the only recipe on the
      # default branch. ExoSnap pins r7. The r6 recipe stays on its own branch,
      # feature/gpl-x264-x265, so that a workflow_dispatch from the default
      # branch cannot produce a GPL artifact by accident.
      #
      # Why: measurement on a real 2560x1440@60 recording showed ExoSnap's Edit-page
      # player peaking at 51.6 fps -- below realtime -- because decode, colour
      # conversion and per-frame allocation all run serially on one CPU thread. The
      # fix is a GPU decode path whose frames stay on the GPU as ID3D11Texture2D.
      # That is impossible with the r5 binary: --disable-everything drops every
      # hwaccel, so avcodec_get_hw_config() returns nothing for h264/hevc/av1 even
      # though avutil can already create a D3D11VA device context. Hardware DECODE
      # deliberately goes through D3D11VA rather than a vendor SDK (unlike the
      # ENCODE path, ExoSnap ADR 0006): one D3D11VA path covers NVIDIA, AMD and
      # Intel, it hands back a D3D11 texture with no interop layer, and decoder
      # output is bit-exact per spec, so there is no vendor quality dimension to
      # chase. DXVA2 variants come along as the legacy fallback -- they cost only
      # compiled size, not a runtime dependency.
      # -----------------------------------------------------------------------
      - name: Configure FFmpeg
        working-directory: ffmpeg-src
        run: |
          CONFIGURE_FLAGS=(
            --arch=x86_64
            --target-os=mingw32
            --cross-prefix=${CROSS_PREFIX}
            --enable-shared
            --disable-static
            --prefix=${INSTALL_PREFIX}
            --disable-everything
            --enable-avformat
            --enable-avcodec
            --enable-avutil
            --enable-swresample
            --disable-programs
            --disable-ffmpeg
            --disable-ffplay
            --disable-ffprobe
            --disable-doc
            --disable-htmlpages
            --disable-manpages
            --disable-podpages
            --disable-txtpages
            --enable-demuxer=mov
            --enable-demuxer=matroska
            --enable-muxer=mp4
            --enable-muxer=mov
            --enable-muxer=matroska
            --enable-muxer=webm
            --enable-protocol=file
            --enable-parser=h264
            --enable-parser=hevc
            --enable-parser=av1
            --enable-parser=aac
            --enable-parser=opus
            --enable-parser=vorbis
            --enable-parser=mpegaudio
            --enable-decoder=h264
            --enable-decoder=hevc
            --enable-decoder=av1
            --enable-decoder=opus
            --enable-decoder=aac
            --enable-decoder=flac
            --enable-decoder=pcm_s16le
            --enable-decoder=pcm_s24le
            --enable-decoder=pcm_s32le
            --enable-decoder=pcm_f32le
            --enable-encoder=aac
            --enable-d3d11va
            --enable-dxva2
            --enable-hwaccel=h264_d3d11va
            --enable-hwaccel=h264_d3d11va2
            --enable-hwaccel=h264_dxva2
            --enable-hwaccel=hevc_d3d11va
            --enable-hwaccel=hevc_d3d11va2
            --enable-hwaccel=hevc_dxva2
            --enable-hwaccel=av1_d3d11va
            --enable-hwaccel=av1_d3d11va2
            --enable-hwaccel=av1_dxva2
            --enable-bsf=aac_adtstoasc
            --enable-bsf=extract_extradata
            --enable-bsf=h264_mp4toannexb
            --enable-bsf=hevc_mp4toannexb
            --enable-bsf=av1_metadata
            --enable-bsf=null
            --enable-w32threads
            --disable-pthreads
            --disable-os2threads
            --disable-debug
            --disable-stripping
            --enable-optimizations
          )

          # Log the configure line for auditing (single line for BUILD-INFO.json)
          CONFIGURE_LINE="./configure ${CONFIGURE_FLAGS[*]}"
          echo "Running: ${CONFIGURE_LINE}"
          # Store for BUILD-INFO.json (escape newlines)
          printf '%s' "${CONFIGURE_LINE}" > /tmp/configure_cmd.txt

          ./configure "${CONFIGURE_FLAGS[@]}"

      # -----------------------------------------------------------------------
      # 4. Build
      # -----------------------------------------------------------------------
      - name: Build FFmpeg
        working-directory: ffmpeg-src
        run: make -j$(nproc)

      # -----------------------------------------------------------------------
      # 5. Install into staging prefix
      # -----------------------------------------------------------------------
      - name: Install FFmpeg into staging prefix
        working-directory: ffmpeg-src
        run: |
          make install
          echo "--- Installed files ---"
          find "${INSTALL_PREFIX}" -type f | sort

      # -----------------------------------------------------------------------
      # 6. Generate MSVC-compatible import libraries with llvm-dlltool
      #
      # The mingw cross build produces libXXX.dll.a (GNU import libs). ExoSnap's
      # cmake/VendorFFmpeg.cmake uses IMPORTED_IMPLIB pointing at MSVC-style
      # XXX.lib files (matching BtbN archive layout). We generate them from
      # the .def files produced by FFmpeg's build system (ffbuild/config.mak
      # lists them; they are written to the lib/ subdir of the build tree, not
      # the install prefix). If not found, generate .def via objdump.
      # -----------------------------------------------------------------------
      - name: Generate MSVC import libs (llvm-dlltool)
        working-directory: ffmpeg-src
        run: |
          BINDIR="${INSTALL_PREFIX}/bin"
          LIBDIR="${INSTALL_PREFIX}/lib"
          BUILD_LIBDIR="$(pwd)"   # .def files live in the build tree root subfolders

          # Resolve llvm-dlltool
          DLLTOOL=$(command -v llvm-dlltool 2>/dev/null || \
                    ls /usr/bin/llvm-dlltool-* 2>/dev/null | sort -V | tail -1)
          echo "Using dlltool: ${DLLTOOL}"
          if [ -z "${DLLTOOL}" ]; then
            echo "ERROR: llvm-dlltool not found" >&2
            exit 1
          fi

          for DLL in "${BINDIR}"/*.dll; do
            BASE=$(basename "${DLL}" .dll)
            # Strip version number suffix: avformat-62 -> avformat
            LIBNAME=$(echo "${BASE}" | sed 's/-[0-9]*$//')
            LIB_OUT="${LIBDIR}/${LIBNAME}.lib"

            # Look for .def in the build tree (FFmpeg writes lib<name>-<ver>.def)
            DEF_FILE=$(ls "${BUILD_LIBDIR}"/${LIBNAME}/${LIBNAME}-*.def \
                          "${BUILD_LIBDIR}"/lib${LIBNAME}/${LIBNAME}-*.def \
                          "${BUILD_LIBDIR}"/lib${LIBNAME}.def \
                          "${BUILD_LIBDIR}"/${LIBNAME}.def \
                          2>/dev/null | head -1)

            if [ -z "${DEF_FILE}" ]; then
              echo "No .def found for ${LIBNAME}; generating from DLL exports via objdump"
              DEF_FILE="/tmp/${LIBNAME}.def"
              # Use nm to get exported symbols, then format as EXPORTS section
              x86_64-w64-mingw32-nm --defined-only --extern-only "${DLL}" \
                | awk '/[0-9a-f]+ T /{print $3}' \
                | sort -u \
                > /tmp/${LIBNAME}_exports.txt
              {
                echo "LIBRARY ${BASE}.dll"
                echo "EXPORTS"
                cat /tmp/${LIBNAME}_exports.txt
              } > "${DEF_FILE}"
              wc -l < /tmp/${LIBNAME}_exports.txt
              echo "Generated .def with $(wc -l < /tmp/${LIBNAME}_exports.txt) exports"
            else
              echo "Using existing .def: ${DEF_FILE}"
            fi

            echo "Generating ${LIB_OUT} from ${BASE}.dll"
            # llvm-dlltool uses GNU-dlltool-compatible --machine strings.
            # "i386:x86-64" is the standard BFD name for x86_64 Windows.
            "${DLLTOOL}" \
              --input-def "${DEF_FILE}" \
              --dllname "${BASE}.dll" \
              --output-lib "${LIB_OUT}" \
              --machine i386:x86-64
            ls -la "${LIB_OUT}"
          done

          echo "--- Generated import libs ---"
          ls -la "${LIBDIR}"/*.lib 2>/dev/null || echo "(none)"

      # -----------------------------------------------------------------------
      # 7. Assemble the release archive in BtbN-compatible layout
      # -----------------------------------------------------------------------
      - name: Assemble release archive
        run: |
          STAGING="/tmp/ffmpeg-staging"
          ARCHIVE_DIR="${STAGING}/ffmpeg-${FFMPEG_REF}-win64-lgpl-shared"
          mkdir -p "${ARCHIVE_DIR}/bin" "${ARCHIVE_DIR}/include" "${ARCHIVE_DIR}/lib"

          # DLLs — mux-only set (avformat, avcodec, avutil, swresample)
          #
          # The soname major of each library is read off the file that was
          # actually produced, never declared, so BUILD-INFO.json cannot claim a
          # major the archive does not carry. The consumer pins these four
          # numbers and refuses to configure when they move (ExoSnap
          # cmake/VendorFFmpeg.cmake), which is what turns an upstream major
          # bump into a named error instead of a link failure.
          LIB_MAJORS=""
          for LIB in avformat avcodec avutil swresample; do
            DLL=$(ls "${INSTALL_PREFIX}/bin/${LIB}"-*.dll 2>/dev/null | head -1)
            if [ -n "${DLL}" ]; then
              cp "${DLL}" "${ARCHIVE_DIR}/bin/"
              BASE=$(basename "${DLL}" .dll)
              MAJOR="${BASE##*-}"
              case "${MAJOR}" in
                ''|*[!0-9]*)
                  echo "ERROR: cannot read a soname major from $(basename "${DLL}")" >&2
                  exit 1
                  ;;
              esac
              LIB_MAJORS="${LIB_MAJORS}${LIB_MAJORS:+,}\"${LIB}\":${MAJOR}"
              echo "Copied DLL: $(basename "${DLL}") (major ${MAJOR})"
            else
              echo "ERROR: DLL not found for ${LIB}" >&2
              exit 1
            fi
          done

          # Import libs
          for LIB in avformat avcodec avutil swresample; do
            LIBFILE="${INSTALL_PREFIX}/lib/${LIB}.lib"
            if [ -f "${LIBFILE}" ]; then
              cp "${LIBFILE}" "${ARCHIVE_DIR}/lib/"
              echo "Copied lib: $(basename "${LIBFILE}")"
            else
              echo "ERROR: import lib not found: ${LIBFILE}" >&2
              exit 1
            fi
          done

          # Headers — only the four ExoSnap-used library subdirs
          for INC in libavformat libavcodec libavutil libswresample; do
            SRC="${INSTALL_PREFIX}/include/${INC}"
            if [ -d "${SRC}" ]; then
              cp -r "${SRC}" "${ARCHIVE_DIR}/include/"
            else
              echo "WARNING: header dir not found: ${SRC}" >&2
            fi
          done

          # FFmpeg LGPL license
          cp ffmpeg-src/COPYING.LGPLv2.1 "${ARCHIVE_DIR}/LICENSE.md"

          # Profile self-check, two-sided: what we asked configure for, and what
          # configure says it did. A GPL or nonfree build reaching an archive
          # labelled lgpl-shared is the one failure this repository has already
          # had once, when the default branch quietly carried the r6 recipe.
          if grep -qE -- '--enable-(gpl|nonfree)' /tmp/configure_cmd.txt; then
            echo "ERROR: the configure line enables gpl or nonfree; this profile is lgpl-shared" >&2
            exit 1
          fi
          # configure writes config.h at the source root, not under ffbuild/,
          # and the location has moved between FFmpeg generations. Find it
          # rather than hard code a path. A missing file stays fatal: a check
          # that cannot find its own input proves nothing, and the n9.0.2
          # dispatch failed here for exactly that reason before this was fixed.
          CONFIG_H=$(find ffmpeg-src -maxdepth 2 -name config.h -print -quit)
          if [ -z "${CONFIG_H}" ]; then
            echo "ERROR: configure's config.h was not found under ffmpeg-src; the profile cannot be verified" >&2
            exit 1
          fi
          echo "Profile self-check reads ${CONFIG_H}"
          grep -qx '#define CONFIG_GPL 0' "${CONFIG_H}" || {
            echo "ERROR: ${CONFIG_H} does not report CONFIG_GPL 0" >&2; exit 1; }
          grep -qx '#define CONFIG_NONFREE 0' "${CONFIG_H}" || {
            echo "ERROR: ${CONFIG_H} does not report CONFIG_NONFREE 0" >&2; exit 1; }
          echo "Profile self-check: CONFIG_GPL 0, CONFIG_NONFREE 0"

          # Build metadata. JSON rather than prose: the consumer reads this to
          # verify the package it downloaded is the package it pinned, and CMake
          # parses JSON natively from 3.19 on, so no regex over a human-readable
          # file has to stay in step with its wording.
          TOOLCHAIN_VER=$(x86_64-w64-mingw32-gcc --version | head -1)
          CONFIGURE_CMD=$(cat /tmp/configure_cmd.txt)
          jq -n \
            --arg packageTag "${PACKAGE_TAG}" \
            --arg upstreamTag "${FFMPEG_REF}" \
            --arg upstreamCommit "${FFMPEG_COMMIT}" \
            --argjson packageRevision "${PACKAGE_REVISION}" \
            --arg buildDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg buildHost "$(uname -srm)" \
            --arg toolchain "${TOOLCHAIN_VER}" \
            --arg configure "${CONFIGURE_CMD}" \
            --argjson libraries "{${LIB_MAJORS}}" \
            '{
              schema: 1,
              packageTag: $packageTag,
              upstreamTag: $upstreamTag,
              upstreamCommit: $upstreamCommit,
              packageRevision: $packageRevision,
              profile: "lgpl-shared",
              architecture: "win64",
              linkage: "shared",
              libraries: $libraries,
              target: "x86_64-w64-mingw32",
              buildDate: $buildDate,
              buildHost: $buildHost,
              toolchain: $toolchain,
              configure: $configure,
              producedBy: "https://github.com/Exoridus/exosnap-ffmpeg-build"
            }' > "${ARCHIVE_DIR}/BUILD-INFO.json"

          echo "--- BUILD-INFO.json ---"
          cat "${ARCHIVE_DIR}/BUILD-INFO.json"

          echo "--- Archive directory contents ---"
          find "${ARCHIVE_DIR}" -type f | sort

          # Create ZIP
          ARCHIVE_NAME="${ARCHIVE_STEM}.zip"
          cd "${STAGING}"
          zip -r "/tmp/${ARCHIVE_NAME}" "ffmpeg-${FFMPEG_REF}-win64-lgpl-shared/"
          echo "ARCHIVE_PATH=/tmp/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

          echo "--- Archive listing ---"
          unzip -l "/tmp/${ARCHIVE_NAME}"

      # -----------------------------------------------------------------------
      # 8. Compute SHA256
      # -----------------------------------------------------------------------
      - name: Compute SHA256
        run: |
          SHA256=$(sha256sum "${ARCHIVE_PATH}" | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "SHA256 of ${ARCHIVE_NAME}: ${SHA256}"
          printf '%s  %s\n' "${SHA256}" "${ARCHIVE_NAME}" > /tmp/SHA256SUMS.txt
          echo "SUMS_PATH=/tmp/SHA256SUMS.txt" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 9. Upload archive as workflow artifact (always — for manual inspection)
      # -----------------------------------------------------------------------
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_TAG }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.SUMS_PATH }}
          retention-days: 30

      # -----------------------------------------------------------------------
      # 10. Create GitHub Release (only on a package tag push)
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: "FFmpeg ${{ env.FFMPEG_REF }} for ExoSnap · LGPL shared · build ${{ env.PACKAGE_REVISION }}"
          body: |
            ## FFmpeg ${{ env.FFMPEG_REF }} — minimal LGPL shared build for ExoSnap

            **Package tag:** `${{ env.PACKAGE_TAG }}`
            **Upstream commit:** `${{ env.FFMPEG_COMMIT }}`
            **Build type:** LGPL-2.1+ shared (no GPL, no nonfree, `--disable-everything` whitelist)
            **Target:** Windows x86-64 (mingw-w64 cross build on ubuntu-latest)

            The archive carries `BUILD-INFO.json`, which states the package tag, the upstream tag and commit, the profile, and the soname major of each library as built. A consumer verifies against that file rather than trusting this text.

            ### Components included
            Libraries: `avformat`, `avcodec`, `avutil`, `swresample`
            Demuxers: `mov` (MP4/MOV input), `matroska` (MKV/WebM input)
            Muxers: `mp4`, `mov` (MP4 faststart), `matroska` (MKV), `webm`
            Protocols: `file`
            Parsers: `h264`, `hevc`, `av1`, `aac`, `opus`, `vorbis`, `mpegaudio`
            Decoders: `h264`, `hevc`, `av1`, `opus`, `aac`, `flac`, `pcm_s16le`, `pcm_s24le`, `pcm_s32le`, `pcm_f32le`
            Encoders: `aac` (AAC-LC — ExoSnap's native-AAC migration, ADR 0052)
            BSFs: `aac_adtstoasc`, `extract_extradata`, `h264_mp4toannexb`, `hevc_mp4toannexb`, `av1_metadata`, `null`
            Hardware accelerators: `h264`/`hevc`/`av1` × `d3d11va`, `d3d11va2`, `dxva2` — GPU decode for the Edit-page player, vendor-neutral (NVIDIA/AMD/Intel). Frames come back as `ID3D11Texture2D`; no vendor SDK, no CUDA interop.

            ### SHA256
            ```
            ${{ env.SHA256 }}  ${{ env.ARCHIVE_NAME }}
            ```

            ### ExoSnap CMake update
            In `cmake/VendorFFmpeg.cmake`, replace the `FetchContent_Declare` block:
            ```cmake
            FetchContent_Declare(
                ffmpeg_prebuilt
                URL      "https://github.com/Exoridus/exosnap-ffmpeg-build/releases/download/${{ github.ref_name }}/${{ env.ARCHIVE_NAME }}"
                URL_HASH "SHA256=${{ env.SHA256 }}"
                DOWNLOAD_EXTRACT_TIMESTAMP TRUE
            )
            ```

